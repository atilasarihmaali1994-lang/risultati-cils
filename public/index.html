<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risultati Esami CILS</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      font-size: 14px;
    }
    .header {
      border-bottom: 1px solid #ccc;
      background: #f4f4f4;
      padding: 18px 0;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
    }
    h1 {
      margin: 0;
      color: #003b79;
      font-size: 25px;
    }
    .sub {
      margin-top: 4px;
      color: #8b0000;
      font-size: 21px;
      font-weight: bold;
    }
    .notice {
      margin-top: 18px;
      padding: 12px 14px;
      background: #fff8db;
      border: 1px solid #e0c766;
      color: #514000;
      line-height: 1.45;
    }
    .box {
      margin-top: 24px;
      border: 1px solid #bbb;
      background: #fafafa;
    }
    .box-title {
      background: #003b79;
      color: #fff;
      padding: 10px 14px;
      font-weight: bold;
      font-size: 17px;
    }
    .box-body {
      padding: 22px;
    }
    .row {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 13px;
    }
    label {
      font-weight: bold;
    }
    input {
      width: 100%;
      max-width: 360px;
      padding: 8px;
      border: 1px solid #999;
      font-size: 14px;
    }
    .actions {
      margin-left: 222px;
      margin-top: 18px;
    }
    button, .download {
      background: #003b79;
      color: white;
      border: 1px solid #002d5c;
      padding: 9px 18px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border: 1px solid #b8d5b8;
      background: #f1fff1;
      color: #195919;
    }
    .error {
      border-color: #e0b1b1;
      background: #fff2f2;
      color: #8b0000;
    }
    footer {
      margin-top: 34px;
      border-top: 1px solid #ddd;
      padding: 18px 0;
      color: #666;
      font-size: 12px;
    }
    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; gap: 5px; }
      input { max-width: none; }
      .actions { margin-left: 0; }
      h1 { font-size: 22px; }
      .sub { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="wrap">
      <h1>Risultati Esami CILS</h1>
      <div class="sub">Accesso documento</div>
    </div>
  </div>

 

    <section class="box">
      <div class="box-title">Inserimento dati</div>
      <div class="box-body">
        <form id="form">
          <div class="row">
            <label for="cognome">Cognome</label>
            <input id="cognome" name="cognome" required>
          </div>
          <div class="row">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" required>
          </div>
          <div class="row">
            <label for="dataNascita">Data di nascita</label>
            <input id="dataNascita" name="dataNascita" type="date" required>
          </div>
          <div class="row">
            <label for="codice">Codice documento</label>
            <input id="codice" name="codice" required>
          </div>
          <div class="actions">
            <button type="submit">Accedi al documento</button>
          </div>
        </form>
        <div id="message" class="message"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">Pagina privata di download documento</div>
  </footer>

  <script>
    const form = document.getElementById("form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.style.display = "block";
      message.className = "message";
      message.textContent = "Verifica dati...";

      const payload = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await fetch("/api/verifica", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || "Errore.");

        message.innerHTML = 'Accesso completato.<br><br><a class="download" href="' + data.downloadUrl + '" download>Scarica documento</a>';
      } catch (err) {
        message.className = "message error";
        message.textContent = err.message;
      }
    });
  </script>
</body>
</html>
