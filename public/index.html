<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Università per Stranieri di Siena - Risultati Esami CILS</title>

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #d9d9d9;
      padding: 22px 0;
    }

    .container {
      width: min(980px, calc(100% - 30px));
      margin: 0 auto;
    }

    .title {
      color: #003b79;
      font-size: 24px;
      font-weight: bold;
      margin: 0;
    }

    .subtitle {
      color: #8b0000;
      font-size: 20px;
      font-weight: bold;
      margin-top: 6px;
    }

    .panel {
      background: #fff;
      border: 1px solid #d4d4d4;
      margin-top: 28px;
    }

    .panel-header {
      background: #003b79;
      color: white;
      padding: 14px 18px;
      font-size: 18px;
      font-weight: bold;
    }

    .panel-body {
      padding: 28px;
    }

    .row {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 14px;
      margin-bottom: 16px;
      align-items: center;
    }

    label {
      font-weight: bold;
      font-size: 16px;
    }

    input {
      width: 100%;
      max-width: 430px;
      padding: 11px;
      border: 1px solid #b8b8b8;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #003b79;
      color: white;
      border: 0;
      padding: 12px 22px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #0052a3;
    }

    .btn-wrap {
      margin-left: 234px;
      margin-top: 20px;
    }

    .message {
      display: none;
      margin-top: 24px;
      padding: 18px;
      background: #edf8ee;
      border: 1px solid #c2e1c5;
      color: #1f6b2b;
      font-size: 16px;
    }

    .message.error {
      background: #fff0f0;
      border-color: #e2b2b2;
      color: #8b0000;
    }

    .download-btn {
      display: inline-block;
      margin-top: 14px;
      text-decoration: none;
      background: #003b79;
      color: white;
      padding: 12px 20px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }

      .btn-wrap {
        margin-left: 0;
      }

      input {
        max-width: none;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container">
      <h1 class="title">Università per Stranieri di Siena</h1>
      <div class="subtitle">Risultati Esami CILS</div>
    </div>
  </header>

  <main class="container">

    <section class="panel">
      <div class="panel-header">
        Inserimento dati
      </div>

      <div class="panel-body">

        <form id="form">

          <div class="row">
            <label for="matricola">Matricola</label>
            <input id="matricola" name="matricola" required>
          </div>

          <div class="row">
            <label for="dataNascita">Data di nascita</label>
            <input id="dataNascita" name="dataNascita" type="date" required>
          </div>

          <div class="row">
            <label for="captcha">Calcolo veloce: 4 + 3 =</label>
            <input id="captcha" name="captcha" required>
          </div>

          <div class="btn-wrap">
            <button type="submit">
              Accedi al documento
            </button>
          </div>

        </form>

        <div id="message" class="message"></div>

      </div>
    </section>

  </main>

  <script>
    const form = document.getElementById("form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      message.style.display = "block";
      message.className = "message";
      message.innerHTML = "Verifica dati in corso...";

      const payload = Object.fromEntries(
        new FormData(form).entries()
      );

      try {
        const res = await fetch("/api/verifica", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(
            data.message || "Dati non validi."
          );
        }

        message.innerHTML = `
          Accesso completato.<br><br>
          <a class="download-btn"
             href="${data.downloadUrl}"
             download>
             Scarica documento
          </a>
        `;

      } catch (err) {
        message.className = "message error";
        message.innerHTML = err.message;
      }
    });
  </script>

</body>
</html>
